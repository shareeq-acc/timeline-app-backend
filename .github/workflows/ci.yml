name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/navigo-server

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm ci`, not `npm install`: it installs exactly the lockfile and fails
      # loudly if the lockfile and package.json disagree.
      - run: npm ci
      # Reported, not blocking: eslint here has not been migrated to v9's flat
      # config and exits 2 before checking anything. Make it a gate once that
      # is done.
      - run: npm run lint
        continue-on-error: true
      # This one blocks. It is the production build, with the same config the
      # image uses, so a type error that only appears without the test files is
      # caught here rather than in a docker build later.
      - run: npm run build
      # Reported, not blocking: the suite needs a database this job does not
      # start. Worth wiring up a Postgres service, separately.
      - run: npm test
        continue-on-error: true
        env:
          NODE_ENV: test

  build:
    name: Build and publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
